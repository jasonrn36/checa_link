<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Monitor de Conexão - RoraimaNET / Inforr</title>

</head>
<body>

  <div class="container">
    <h1>Monitoramento de Rota de Internet</h1>
    <div class="subtitle">Verificação automática a cada 10 minutos</div>

    <!-- Alerta quando a velocidade cai -->
    <div id="alertBanner" class="alert-banner">
      ⚠️ Estamos com lentidão neste percurso!
    </div>

    <!-- Mapa da Rede -->
    <div id="networkMap" class="network-map">
      
      <!-- Ponto 1: Meu Link -->
      <div class="node">
        <div class="circle">
          <svg viewBox="0 0 24 24"><path d="M12,3C7.58,3 4,4.79 4,7C4,9.21 7.58,11 12,11C16.42,11 20,9.21 20,7C20,4.79 16.42,3 12,3M4,9V12C4,14.21 7.58,16 12,16C16.42,16 20,14.21 20,12V9C20,11.21 16.42,13 12,13C7.58,13 4,11.21 4,9M4,14V17C4,19.21 7.58,21 12,21C16.42,21 20,19.21 20,17V14C20,16.21 16.42,18 12,18C7.58,18 4,16.21 4,14Z"/></svg>
        </div>
        <span class="node-title">Meu Link</span>
        <span class="node-sub">Origem</span>
      </div>

      <div class="connection-line"></div>

      <!-- Ponto 2: Servidor Inforr -->
      <div class="node">
        <div class="circle">
          <svg viewBox="0 0 24 24"><path d="M4,1H20A1,1 0 0,1 21,2V6A1,1 0 0,1 20,7H4A1,1 0 0,1 3,6V2A1,1 0 0,1 4,1M4,9H20A1,1 0 0,1 21,10V14A1,1 0 0,1 20,15H4A1,1 0 0,1 3,14V10A1,1 0 0,1 4,9M4,17H20A1,1 0 0,1 21,18V22A1,1 0 0,1 20,23H4A1,1 0 0,1 3,22V18A1,1 0 0,1 4,17Z"/></svg>
        </div>
        <span class="node-title">Inforr</span>
        <span class="node-sub">Servidor Intermediário</span>
      </div>

      <div class="connection-line"></div>

      <!-- Ponto 3: Servidor RoraimaNet -->
      <div class="node">
        <div class="circle">
          <svg viewBox="0 0 24 24"><path d="M19,13C19.34,13 19.67,13.04 20,13.09V8A2,2 0 0,0 18,6H4A2,2 0 0,0 2,8V16A2,2 0 0,0 4,18H13.09C13,17.67 13,17.34 13,17A6,6 0 0,1 19,13M4,8H18V10H4V8M19,15V18H22V20H19V23H17V20H14V18H17V15H19Z"/></svg>
        </div>
        <span class="node-title">RoraimaNET</span>
        <span class="node-sub">Boa Vista</span>
      </div>

    </div>

    <!-- Resultados em Números -->
    <div class="metrics">
      <div class="metric-box">
        <div id="speedValue" class="metric-value">0.0 Mbps</div>
        <div class="metric-label">Velocidade Medida</div>
      </div>
      <div class="metric-box">
        <div id="pingValue" class="metric-value">0 ms</div>
        <div class="metric-label">Latência (Ping)</div>
      </div>
      <div class="metric-box">
        <div id="statusValue" class="metric-value" style="color:#10b981;">Normal</div>
        <div class="metric-label">Status da Conexão</div>
      </div>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button class="btn-test" onclick="executarTeste()">Executar Teste Agora</button>
      <div class="timer-info">
        Próximo teste em: <strong id="timer">10:00</strong>
      </div>
    </div>
  </div>

  <script>
    const INTERVALO_MINUTOS = 10;
    let tempoRestante = INTERVALO_MINUTOS * 60;

    // Função que simula a medição da conexão
    function executarTeste() {
      const alertBanner = document.getElementById('alertBanner');
      const networkMap = document.getElementById('networkMap');
      const speedValue = document.getElementById('speedValue');
      const pingValue = document.getElementById('pingValue');
      const statusValue = document.getElementById('statusValue');

      // Gera um valor de teste simulado (para testes reais, integre com uma API de speedtest/backend)
      // Gera aleatoriamente entre 1 e 50 Mbps
      const velocidadeMedida = (Math.random() * 45 + 1).toFixed(1); 
      const pingMedido = Math.floor(Math.random() * 20 + 5); // Ping entre 5ms e 25ms

      speedValue.innerText = `${velocidadeMedida} Mbps`;
      pingValue.innerText = `${pingMedido} ms`;

      // Regra de Validação: Menos de 5 Mega = Linha Vermelha e Alerta
      if (parseFloat(velocidadeMedida) < 5.0) {
        networkMap.classList.add('status-bad');
        alertBanner.style.display = 'block';
        statusValue.innerText = "Lento";
        statusValue.style.color = "#ef4444";
      } else {
        networkMap.classList.remove('status-bad');
        alertBanner.style.display = 'none';
        statusValue.innerText = "Normal";
        statusValue.style.color = "#10b981";
      }

      // Reinicia o contador de 10 minutos
      tempoRestante = INTERVALO_MINUTOS * 60;
    }

    // Função do temporizador regressivo
    function atualizarTemporizador() {
      const timerElement = document.getElementById('timer');
      const minutos = Math.floor(tempoRestante / 60);
      const segundos = tempoRestante % 60;

      timerElement.innerText = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;

      if (tempoRestante <= 0) {
        executarTeste();
      } else {
        tempoRestante--;
      }
    }

    // Inicialização ao carregar a página
    window.onload = () => {
      executarTeste(); // Executa o primeiro teste imediatamente
      setInterval(atualizarTemporizador, 1000); // Atualiza o relógio a cada segundo
    };
  </script>
</body>
</html>
